html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}

h1,h2,h3{line-height:1.25;margin:0 0 .5em;text-transform:var(--head-tt);letter-spacing:var(--head-ls);font-weight:800}
h1{font-size:clamp(1.7rem,6vw,2.7rem)}
h2{font-size:clamp(1.3rem,4.2vw,1.75rem)}
h3{font-size:1.15rem}
p{margin:0 0 1em}
a{color:var(--primary);text-decoration:none;transition:color .15s ease}
a:hover{text-decoration:underline}
ul,ol{padding-left:1.2em}
.wrap{max-width:1140px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-999px;top:8px;background:var(--primary);color:var(--on-primary);padding:8px 14px;z-index:100;border-radius:var(--radius)}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
main{padding:28px 0 54px;outline:none}
section{margin-bottom:36px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{position:sticky;top:0;z-index:30;background:var(--top-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);transition:background .25s ease,border-color .25s ease}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-top:10px;padding-bottom:10px}
.logo{display:inline-flex;align-items:center;gap:8px;font-weight:850;font-size:1.45rem;text-decoration:none;color:var(--text);margin-right:auto;letter-spacing:-0.02em}
.logo span{color:var(--primary)}
.logo-tag{font-size:.7rem;padding:2px 7px;border-radius:999px;background:var(--chip-bg);color:var(--chip-text);border:1px solid var(--border);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
[data-theme="hack"] .logo{text-shadow:2px 0 #ff003c,-2px 0 #00e5ff}
[data-theme="neon"] .logo{text-shadow:0 0 10px rgba(255,0,127,.6)}
.burger{min-height:42px;padding:8px 14px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}

.tools{display:flex;align-items:center;gap:8px;order:2}
.user-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;font-size:.88rem;font-weight:700;color:var(--text)}

.hero p{font-size:1.15rem;max-width:62ch;color:var(--muted);line-height:1.6}

.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.25);text-decoration:none}

input:focus,select:focus,textarea:focus{border-color:var(--focus);box-shadow:0 0 0 3px rgba(37,99,235,.18);outline:none}
.tools select{width:auto;min-height:38px;padding:4px 10px;font-weight:600}

.field{margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr;gap:12px 18px}

.reg-card{max-width:680px;margin:0 auto}
.login-card{max-width:440px;margin:0 auto}
.filters{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.filter-field label{font-size:.86rem;margin-bottom:4px}

.btn-chip:hover{border-color:var(--primary);color:var(--primary)}

.badge.ok{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}

caption{text-align:left;font-weight:700;padding:10px 14px;font-size:1.05rem}

legend{font-weight:700;font-size:1.1rem;margin-bottom:12px}

.blurred .txt{filter:blur(6px);user-select:none}
.rooms{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.themes{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.sw{display:flex;gap:4px;margin-top:6px}
.sw i{width:22px;height:14px;border-radius:3px;border:1px solid var(--border)}
details{border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:12px;background:var(--surface)}
summary{cursor:pointer;font-weight:700;min-height:28px}
.tree{list-style:none;padding-left:0}
.tree li{padding:8px 0;border-top:1px solid var(--border)}
.demo-creds{margin-top:24px;border-style:dashed}
.demo-creds summary{color:var(--primary)}
.creds-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-top:10px}
.cred-chip{text-align:left;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;font:inherit;transition:all .15s ease}
.cred-chip:hover{border-color:var(--primary);background:var(--chip-bg)}
.cred-chip strong{display:block;font-size:.88rem;color:var(--text)}
.cred-chip small{display:block;font-size:.78rem;color:var(--muted);margin-top:2px}
.contacts-bar{display:flex;flex-wrap:wrap;gap:12px;font-size:.88rem;font-weight:600;margin:8px 0;padding:6px 10px;background:var(--surface2);border-radius:var(--radius)}
.contacts-bar a{display:inline-flex;align-items:center;gap:4px}
.course-promo-banner{background:var(--surface);border:1.5px solid var(--primary);border-radius:var(--radius);padding:16px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
footer{border-top:1px solid var(--border);padding:24px 0;color:var(--muted);font-size:.92rem;background:var(--surface)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:92vw;background:var(--text);color:var(--bg);padding:12px 22px;border-radius:var(--radius);z-index:99;opacity:0;pointer-events:none;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,.25);transition:opacity .25s ease,transform .25s ease}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(6px);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-hover);max-width:580px;width:100%;max-height:90vh;overflow-y:auto;padding:26px}
.test-nav-pills{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.test-pill{width:36px;height:36px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;font-size:.88rem}
.test-pill.curr{border-color:var(--primary);background:var(--primary);color:var(--on-primary)}
.test-pill.done{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function initLiveWallpaper() {
var canvas = document.getElementById('live-bg');
if (!canvas) return;
var ctx = canvas.getContext('2d');
var w, h;
function resize() {
w = canvas.width = window.innerWidth;
h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();
var particles = [];
for (var i = 0; i < 45; i++) {
particles.push({
x: Math.random() * w, y: Math.random() * h,
vx: (Math.random() - 0.5) * 0.9, vy: (Math.random() - 0.5) * 0.9,
size: Math.random() * 2 + 1, alpha: Math.random() * 0.5 + 0.3
});
}
var radarAngle = 0;
var scanY = 0;
function loop() {
var th = state.theme || 'light';
ctx.clearRect(0, 0, w, h);
if (th === 'hack') {
ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
ctx.lineWidth = 1;
for (var p1 = 0; p1 < particles.length; p1++) {
var pt = particles[p1];
pt.x += pt.vx; pt.y += pt.vy;
if (pt.x < 0) pt.x = w; if (pt.x > w) pt.x = 0;
if (pt.y < 0) pt.y = h; if (pt.y > h) pt.y = 0;
ctx.fillStyle = p1 % 4 === 0 ? 'rgba(252, 238, 10, 0.7)' : 'rgba(0, 229, 255, 0.7)';
ctx.fillRect(pt.x, pt.y, 2, 2);
for (var p2 = p1 + 1; p2 < particles.length; p2++) {
var pt2 = particles[p2];
var dist = Math.hypot(pt.x - pt2.x, pt.y - pt2.y);
if (dist < 110) {
ctx.beginPath(); ctx.moveTo(pt.x, pt.y); ctx.lineTo(pt2.x, pt2.y); ctx.stroke();
}
}
}
scanY = (scanY + 1.2) % h;
ctx.fillStyle = 'rgba(0, 229, 255, 0.035)';
ctx.fillRect(0, scanY, w, 2);
} else if (th === 'neon') {
for (var j = 0; j < particles.length; j++) {
var p = particles[j];
p.y -= 0.6;
if (p.y < 0) { p.y = h; p.x = Math.random() * w; }
ctx.fillStyle = j % 2 === 0 ? 'rgba(255, 0, 127, 0.6)' : 'rgba(252, 238, 10, 0.6)';
ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 1.4, 0, Math.PI * 2); ctx.fill();
}
ctx.strokeStyle = 'rgba(255, 0, 127, 0.07)';
ctx.lineWidth = 1.5;
var horizonY = h * 0.72;
for (var gy = horizonY; gy < h; gy += 18) {
ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();
}
} else if (th === 'vault') {
radarAngle += 0.02;
var cx = w * 0.85, cy = h * 0.28, r = 160;
ctx.strokeStyle = 'rgba(31, 252, 50, 0.12)';
ctx.lineWidth = 1;
ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
ctx.beginPath(); ctx.arc(cx, cy, r * 0.5, 0, Math.PI * 2); ctx.stroke();
ctx.strokeStyle = 'rgba(31, 252, 50, 0.3)';
ctx.beginPath(); ctx.moveTo(cx, cy);
ctx.lineTo(cx + Math.cos(radarAngle) * r, cy + Math.sin(radarAngle) * r);
ctx.stroke();
} else if (th === 'dark') {
for (var k = 0; k < particles.length; k++) {
var sp = particles[k];
sp.y += sp.vy * 0.5;
if (sp.y < 0) sp.y = h; if (sp.y > h) sp.y = 0;
ctx.fillStyle = 'rgba(56, 189, 248, ' + (sp.alpha * 0.7) + ')';
ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2); ctx.fill();
}
} else {
for (var l = 0; l < 16; l++) {
var ob = particles[l];
ob.x += ob.vx * 0.35; ob.y += ob.vy * 0.35;
if (ob.x < 0) ob.x = w; if (ob.x > w) ob.x = 0;
if (ob.y < 0) ob.y = h; if (ob.y > h) ob.y = 0;
ctx.fillStyle = l % 2 === 0 ? 'rgba(37, 99, 235, 0.035)' : 'rgba(16, 185, 129, 0.035)';
ctx.beginPath(); ctx.arc(ob.x, ob.y, 45 + ob.size * 10, 0, Math.PI * 2); ctx.fill();
}
}
requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
}
// SECTION: shuffle-engine
function shuffleArray(arr) {
var a = arr.slice(0);
for (var i = a.length - 1; i > 0; i--) {
var j = Math.floor(Math.random() * (i + 1));
var temp = a[i]; a[i] = a[j]; a[j] = temp;
}
return a;
}
function prepareTestQuestions(mode, subjId) {
var pool = QUESTION_BANK.slice(0);
if (subjId) {
var f = pool.filter(function (q) { return q.subj === subjId; });
if (f.length) pool = f;
}
pool = shuffleArray(pool);
var count = 5;
if (mode === 'practice') count = 5;
else if (mode === 'test') count = 8;
else if (mode === 'mini') count = 10;
else if (mode === 'full') count = 12;
else if (mode === 'mistakes') count = 5;
var selected = pool.slice(0, Math.min(count, pool.length));
return selected.map(function (item) {
var correctText = item.opts[item.ans];
var shuffledOpts = shuffleArray(item.opts);
var newAnsIdx = shuffledOpts.indexOf(correctText);
return {
id: item.id,
subj: item.subj,
q: item.q,
opts: shuffledOpts,
ans: newAnsIdx,
hint: item.hint,
exp: item.exp
};
});
}

} else if (k === 'ai-gen') {
var sb = document.getElementById('ais').value;
var lv = document.getElementById('ail').value;
var tp = document.getElementById('ait').value;
generateAiTask(sb, lv, tp);
renderPage();
} else if (k === 'ai-check-form') {
var sel = form.querySelector('input[name="ai-ans"]:checked');
var out = document.getElementById('aitxt');
if (!sel) {
if (out) out.textContent = t('q.pick');
return;
}
var val = Number(sel.value);
if (val === state.aiTask.ans) {
out.innerHTML = '<span style="color:var(--accent);">✅ ' + t('q.right') + ' (+10 XP)</span>';
state.user.todayDone = (state.user.todayDone || 0) + 1;
saveUserSettings();
} else {
out.innerHTML = '<span style="color:var(--danger);">❌ ' + t('q.wrong') + '</span>';
}
} else if (k === 'tutor') {
var inp = document.getElementById('tq'); if (!inp.value.trim()) return;
var userText = inp.value.trim();
tutorInit();
state.tutor.push({ me: true, text: userText });
var low = userText.toLowerCase();
var botReply = t('ai.tutorReply');
if (low.indexOf('дискриминант') >= 0 || low.indexOf('квадрат') >= 0 || low.indexOf('discriminant') >= 0) {
botReply = state.lang === 'kk' ? 'Квадрат теңдеу үшін D = b² − 4ac. Егер D > 0 болса, 2 түбір: x = (-b ± √D) / (2a). D = 0 болса, 1 түбір. D < 0 болса, нақты түбірі жоқ!' :
(state.lang === 'ru' ? 'Для квадратного уравнения дискриминант D = b² − 4ac. Если D > 0, 2 корня: x = (-b ± √D)/(2a). При D = 0 один корень, при D < 0 действительных корней нет!' :
'For quadratic equation D = b² - 4ac. If D > 0, there are 2 roots: x = (-b ± √D)/(2a). If D = 0, one root. If D < 0, no real roots!');
} else if (low.indexOf('сақ') >= 0 || low.indexOf('хандық') >= 0 || low.indexOf('тарих') >= 0 || low.indexOf('саки') >= 0 || low.indexOf('history') >= 0) {
botReply = state.lang === 'kk' ? 'Қазақ хандығы 1465 жылы құрылған (Керей мен Жәнібек). Ал сақтар кезеңі — б.з.б. VIII–III ғғ. (Шілікті, Есік қорғандары).' :
(state.lang === 'ru' ? 'Казахское ханство образовано в 1465 году ханами Кереем и Жанибеком. Эпоха саков датируется VIII–III вв. до н.э. (курганы Шиликти, Иссык).' :
'The Kazakh Khanate was founded in 1465 by Kerei and Zhanibek. The Saka period dates back to VIII-III centuries BC (Shilikty, Issyk mounds).');
} else if (low.indexOf('ньютон') >= 0 || low.indexOf('физика') >= 0 || low.indexOf('newton') >= 0) {
botReply = state.lang === 'kk' ? 'Ньютонның 2-заңы: F = m * a. Күш масса мен үдеудің көбейтіндісіне тең. Өлшем бірлігі: 1 Ньютон (Н).' :
(state.lang === 'ru' ? 'Второй закон Ньютона: F = m * a. Сила равна произведению массы на ускорение. Единица измерения: 1 Ньютон (Н).' :
"Newton's 2nd law: F = m * a. Force equals mass times acceleration. Unit of measure: 1 Newton (N).");
} else if (low.indexOf('балл') >= 0 || low.indexOf('грант') >= 0 || low.indexOf('score') >= 0) {
botReply = state.lang === 'kk' ? 'Жоғары балл жинау үшін күн сайын 20+ тест тапсырып, қатемен жұмыс жасаңыз. Біздің платформа сіздің әлсіз тақырыптарыңызды автоматты түрде талдайды!' :
(state.lang === 'ru' ? 'Чтобы набрать высокий балл на ЕНТ, решайте от 20 тестов ежедневно и делайте работу над ошибками. Платформа фиксирует ваши слабые темы!' :
'To achieve a top score on UNT, practice 20+ questions daily and review mistakes. Our platform automatically targets your weak topics!');
}
state.tutor.push({ me: false, text: botReply });
renderPage();
} else if (k === 'chat') {
var ci = document.getElementById('cm'); if (!ci.value.trim()) return;
var d = new Date(), hh = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
state.chat[state.room].push({ u: t('com.you'), t: hh, me: true, x: ci.value.trim() });
renderPage();
toast(t('toast.sent'));
} else if (k === 'profile') {
var p1El = document.getElementById('p1'), p2El = document.getElementById('p2'), p3El = document.getElementById('p3'), p4El = document.getElementById('p4'), p5El = document.getElementById('p5');
if (p1El) state.user.first = p1El.value.trim();
if (p2El) state.user.last = p2El.value.trim();
if (p3El) state.user.city = p3El.value;
if (p4El) state.user.grade = p4El.value;
if (p5El) state.user.targetScore = Number(p5El.value) || 120;
saveUserSettings();
toast(t('toast.saved'));
} else if (k === 'apply-form') {
var ttl = document.getElementById('app-title').value;
var nm = document.getElementById('ap-name').value.trim();
state.requests.unshift({ n: nm || state.user.first, s: 'math', st: 'st.new' });
closeModal();
toast(t('mod.applySuccess'));
if (state.route === 'panel') renderPage();
} else if (k === 'promote-form') {
var org = document.getElementById('pm-org').value.trim();
var cTitle = document.getElementById('pm-title').value.trim();
var cPrice = Number(document.getElementById('pm-price').value) || 45000;
var cCity = document.getElementById('pm-city').value;
var cPhone = document.getElementById('pm-phone').value.trim();
var cEmail = document.getElementById('pm-email').value.trim();
COURSES.unshift({
id: Date.now(),
title: { kk: cTitle, ru: cTitle, en: cTitle },
org: org,
city: cCity,
fmt: 'online',
subj: ['math', 'phys'],
price: cPrice,
rating: 5.0,
ok: true,
phone: cPhone,
email: cEmail,
promoted: true
});
state.audit.unshift([new Date().toLocaleTimeString(), 'provider', 'au.act1']);
closeModal();
toast(t('mod.promoteSuccess'));
renderPage();
} else if (k === 'report-form') {
var rIdx = Number(document.getElementById('rep-idx').value);
var reason = document.getElementById('rep-reason').value;
if (state.chat[state.room][rIdx]) {
state.chat[state.room][rIdx].hidden = true;
state.queue.unshift({ id: Date.now(), type: 'ty.message', target: state.chat[state.room][rIdx].u + ' (' + t(reason) + ')', status: 'st.review' });
}
closeModal();
toast(t('mod.reportSuccess'));
renderPage();
} else if (k === 'forgot-form') {
var btn = document.getElementById('fg-btn');
var codeBox = document.getElementById('fg-code-box');
var pwBox = document.getElementById('fg-pw-box');
var hint = document.getElementById('fg-hint');
if (codeBox.style.display === 'none') {
codeBox.style.display = 'block';
pwBox.style.display = 'block';
hint.textContent = t('mod.codeHint', { code: '482910' });
btn.textContent = t('mod.savePass');
} else {
var inpCode = document.getElementById('fg-code').value.trim();
var newP = document.getElementById('fg-pw').value.trim();
if (inpCode === '482910' && newP) {
closeModal();
toast(t('mod.passUpdated'));
} else {
toast(t('mod.badCode'));
}
}
}
});
window.addEventListener('hashchange', function () {
state.focusMain = true;
render();
});
// SECTION: init
loadSettings();
render();
initLiveWallpaper();
})();
</script>
</body>
</html>
